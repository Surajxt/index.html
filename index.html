
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
        }

        .card {
            max-width: 500px;
            margin: auto;
            padding: 30px;
            background: #1e293b;
            border-radius: 15px;
        }

        h1 {
            color: #38bdf8;
        }

        button {
            padding: 12px 25px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to My Website</h1>
        <p>I am learning web development.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Thanks for visiting my website!";
        }
    </script>
</body>
</html>
